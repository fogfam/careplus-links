<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <title>Open equipment in RepairFlow</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0b1f3a; background: #f3f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); background: radial-gradient(circle at top right, #d8f7f8 0, transparent 42%), #f3f7f8; }
    main { width: min(100%, 430px); background: #fff; border: 1px solid #dce7eb; border-radius: 28px; padding: 28px; box-shadow: 0 20px 55px rgba(11, 31, 58, .12); }
    .brand { display: flex; align-items: center; gap: 12px; color: #087f82; font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    .mark { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 14px; color: #fff; background: linear-gradient(135deg, #0b1f3a, #0aa9ad); font-size: 24px; }
    h1 { margin: 28px 0 10px; font-size: clamp(30px, 9vw, 42px); line-height: 1.02; letter-spacing: -.04em; }
    .intro { margin: 0; color: #627487; font-size: 17px; line-height: 1.5; }
    .record { margin: 24px 0; padding: 16px; border-radius: 18px; background: #eefafa; border: 1px solid #d2eeee; }
    .label { margin: 0 0 6px; color: #087f82; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    #equipment-id { margin: 0; font-size: 18px; font-weight: 750; overflow-wrap: anywhere; }
    .actions { display: grid; gap: 12px; }
    a, button { width: 100%; min-height: 54px; display: inline-flex; align-items: center; justify-content: center; border-radius: 16px; border: 0; font: inherit; font-weight: 750; text-decoration: none; }
    #open-app { color: #fff; background: #078d90; box-shadow: 0 10px 25px rgba(7, 141, 144, .22); }
    button { color: #80909f; background: #edf1f3; }
    .help { margin: 20px 0 0; color: #80909f; font-size: 13px; line-height: 1.45; text-align: center; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark" aria-hidden="true">↻</span><span>RepairFlow</span></div>
    <h1 id="title">Open equipment</h1>
    <p class="intro" id="message">Continue in RepairFlow to view this equipment record.</p>
    <section class="record" id="record" aria-labelledby="record-label">
      <p class="label" id="record-label">Equipment ID</p>
      <p id="equipment-id"></p>
    </section>
    <div class="actions">
      <a id="open-app" href="#">Open in RepairFlow</a>
      <button type="button" disabled aria-disabled="true">App Store — coming soon</button>
    </div>
    <p class="help">If RepairFlow is installed, the first button opens the matching equipment detail.</p>
  </main>
  <script>
    (function () {
      "use strict";
      var id = new URLSearchParams(window.location.search).get("id");
      var validId = typeof id === "string" && /^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$/.test(id);
      var title = document.getElementById("title");
      var message = document.getElementById("message");
      var record = document.getElementById("record");
      var equipmentId = document.getElementById("equipment-id");
      var openApp = document.getElementById("open-app");

      if (!validId) {
        title.textContent = "Invalid equipment link";
        message.textContent = "This link is missing a valid equipment ID. Ask the sender for a new RepairFlow link.";
        record.hidden = true;
        openApp.hidden = true;
        return;
      }

      equipmentId.textContent = id;
      openApp.setAttribute("href", "repairflow://equipment/" + encodeURIComponent(id));
    }());
  </script>
</body>
</html>
