<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1f3a">
  <title>CARE+ Links</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #0b1f3a; background: #f3f7f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at top right, #d8f7f8 0, transparent 44%), #f3f7f8; }
    main { width: min(100%, 600px); background: #fff; border: 1px solid #dce7eb; border-radius: 30px; padding: clamp(28px, 7vw, 48px); box-shadow: 0 20px 55px rgba(11, 31, 58, .12); }
    .eyebrow { color: #087f82; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 18px 0 12px; font-size: clamp(38px, 11vw, 64px); line-height: .98; letter-spacing: -.05em; }
    p { margin: 0; color: #627487; font-size: 18px; line-height: 1.55; }
    .status { margin-top: 30px; display: flex; align-items: center; gap: 10px; color: #087f82; font-size: 14px; font-weight: 750; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #2cb67d; box-shadow: 0 0 0 6px #e6f7ef; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Fogarty QSR Solutions</div>
    <h1>CARE+ Links</h1>
    <p>Secure mobile links for RepairFlow equipment records.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span><span>Link service active</span></div>
  </main>
</body>
</html>
